[versions]
java = "21"
# https://kotlinlang.org/
kotlin = "2.1.20"
# https://plugins.gradle.org/plugin/net.neoforged.moddev
moddev = "2.0.89"
# https://fabricmc.net/develop/
loom = "1.10-SNAPSHOT"
# https://kotlinlang.org/docs/dokka-get-started.html
dokka = "2.0.0"

minecraft = "1.21.1"
minecraftRange = "[1.21.1, 1.21.2)"

# https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment = "2024.11.17"
parchmentMC = "1.21.1"
# https://projects.neoforged.net/neoforged/neoforge
neoforge = "21.1.174"
neoforgeRange = "[21.1, 21.2)"
# https://projects.neoforged.net/neoforged/neoform
neoForm = "1.21.1-20240808.144430"
# https://github.com/thedarkcolour/KotlinForForge/
# https://docs.google.com/spreadsheets/d/1v8K90PBa5qPFrlHBA8PSqlBTYCcp078o5E2XQbt5BUs/edit?gid=0#gid=0
kff = "5.8.0"
kffRange = "[5.8, )"

# https://fabricmc.net/develop/
fabricLoader = "0.16.14"
fabricApi = "0.116.1+1.21.1"
# https://github.com/FabricMC/fabric-language-kotlin#usage
flk = "1.13.2+kotlin.2.1.20"

# https://jenkins.liteloader.com/view/Other/job/Mixin/
mixin = "0.8.7"
# https://github.com/LlamaLad7/MixinExtras
mixinExtras = "0.4.1"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
loom = { id = "fabric-loom", version.ref = "loom" }